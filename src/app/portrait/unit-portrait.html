<div class="frame" [class.small]="small()">
  @if (gameOk()) {
    <img
      [src]="gameSrc()"
      [alt]="name()"
      referrerpolicy="no-referrer"
      (error)="gameOk.set(false)"
    />
  } @else {
    <div class="badge" role="img" [attr.aria-label]="name()" [style.--hue]="hue()">
      {{ initials() }}
    </div>
  }
</div>
